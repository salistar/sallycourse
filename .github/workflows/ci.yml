# CI — SALLYCOURSE monorepo.
#
# Sur chaque push/PR : lint + typecheck + tests sur tous les workspaces,
# puis build des images Docker (web + worker) en mode vérification
# uniquement (pas de push registre — c'est le rôle de deploy.yml).
#
# Secrets requis : AUCUN pour ce workflow (tout tourne en local au runner).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur la même PR/branche annule le run précédent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aligné sur packageManager (package.json) et les Dockerfile (node:22).
  NODE_VERSION: '22'
  PNPM_VERSION: '10.32.1'

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: tsc --noEmit sur tous les workspaces
        run: pnpm -r typecheck

  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Tests sur tous les workspaces
        run: pnpm -r test

  build-images:
    name: Build image Docker (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build de vérification uniquement : pas de push registre ici.
    # Le push/déploiement réel est géré par deploy.yml (manuel ou tag).
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image ${{ matrix.app }} (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: false
          tags: sallycourse-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

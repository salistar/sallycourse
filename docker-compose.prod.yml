# Overlay production : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  web:
    image: ghcr.io/salistar/sallycourse-web:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [internal, edge]

  worker:
    image: ghcr.io/salistar/sallycourse-worker:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
    networks: [internal]

  mongo:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [internal]

  redis:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [internal]

  minio:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [internal]

  # ── Services IA (profil ai, cf. docker-compose.yml) ──────────────
  # ollama peut charger des modèles volumineux en mémoire : plafond large
  # mais borné pour éviter l'éviction OOM d'autres services si démarré en prod.
  ollama:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "2"
    networks: [internal]

  piper:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    networks: [internal]

  # ── Monitoring (profil monitoring) ───────────────────────────────
  uptime-kuma:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal, edge]

  # ── Outils de debug (profil debug — non destinés à la prod, limites
  # posées par prudence si le profil est démarré par erreur) ────────
  mongo-express:
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal]

  redis-commander:
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal]

  mailpit:
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal]

networks:
  internal:
    internal: true
  edge:

# Overlay production : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  web:
    image: ghcr.io/salistar/sallycourse-web:latest
    ports: !override ["127.0.0.1:3000:3000"]
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # URLs médias présignées par le web (pages/preview) : elles doivent être
      # résolubles par le NAVIGATEUR — le hostname Docker interne `minio:9000`
      # ne l'est pas. On présigne donc avec le domaine média public (Caddy →
      # 127.0.0.1:9000 → minio, Host préservé donc signature valide). Le worker
      # garde S3_ENDPOINT interne (uploads volumineux sans sortir du réseau).
      S3_ENDPOINT: "https://media-sallycourse.salistar.com"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [internal, edge]

  worker:
    image: ghcr.io/salistar/sallycourse-worker:latest
    restart: unless-stopped
    # /metrics (base compose : "9090:9090") était publié sur TOUTES les
    # interfaces (0.0.0.0), donc atteignable depuis Internet SANS auth
    # (vérifié 2026-07-29 : curl http://<IP publique>:9090/metrics → 200) —
    # même piège que minio (docker-compose.yml ports concatène avec l'overlay
    # au lieu de le remplacer, sauf `!override`). Le dashboard super-admin
    # /admin/ops lit ces métriques via le réseau `internal` (worker:9090,
    # résolution DNS Docker), jamais besoin d'une exposition publique.
    ports: !override ["127.0.0.1:9090:9090"]
    deploy:
      resources:
        limits:
          memory: 4g
    networks: [internal, edge]

  mongo:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [internal]

  redis:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          memory: 512m
    networks: [internal]

  minio:
    restart: unless-stopped
    # Publié sur loopback UNIQUEMENT : seul Caddy (media-sallycourse.salistar.com)
    # y accède ; pas d'exposition Internet directe (Docker bypasse UFW sinon).
    ports: !override ["127.0.0.1:9000:9000"]
    deploy:
      resources:
        limits:
          memory: 1g
    # `edge` OBLIGATOIRE pour la publication de port : le réseau `internal` est
    # `internal: true` (sans passerelle) et Docker ignore silencieusement les
    # ports publiés d'un conteneur qui n'a que des réseaux internes.
    networks: [internal, edge]

  # ── Services IA (profil ai, cf. docker-compose.yml) ──────────────
  # ollama peut charger des modèles volumineux en mémoire : plafond large
  # mais borné pour éviter l'éviction OOM d'autres services si démarré en prod.
  ollama:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "2"
    networks: [internal, edge]

  piper:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    networks: [internal]

  # ── Monitoring (profil monitoring) ───────────────────────────────
  uptime-kuma:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal, edge]

  # ── Outils de debug (profil debug — non destinés à la prod, limites
  # posées par prudence si le profil est démarré par erreur) ────────
  mongo-express:
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal]

  redis-commander:
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal]

  mailpit:
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks: [internal]

networks:
  internal:
    internal: true
  edge:

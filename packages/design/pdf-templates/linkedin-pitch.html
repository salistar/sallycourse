<!doctype html>
<html lang="{{lang}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <title>SALISTAR — dossier de candidature LinkedIn Learning</title>
  <style>
    /* ============================================================
       SALISTAR — dossier de candidature LinkedIn Learning (Prompt 102)
       A4 portrait, thème clair — même famille visuelle que
       deployment-report.html (masthead violet + cartes claires).
       Rendu : Playwright page.pdf() (Chromium).
       Couleurs figées issues de packages/design/src/tokens.json
       (source de vérité : packages/design/src/tokens.ts)

       Fragments injectés BRUTS (HTML de confiance généré par le loader) :
         {{{planHtml}}}            — bullet points du plan (contrat .lp-plan-item)
         {{{differentiatorsHtml}}} — arguments différenciants (contrat .lp-diff-item)
       ============================================================ */
    :root {
      --paper: #FFFFFF;
      --paper-subtle: #FAF8FC;   /* neutral.50 */
      --ink: #231B2F;            /* neutral.900 */
      --ink-soft: #4B4157;       /* neutral.700 */
      --muted: #7F7492;          /* neutral.500 */
      --line: #E7E2EE;           /* neutral.200 */
      --rule: #D3CBDF;           /* neutral.300 */
      --violet-50: #F8F4FC;
      --violet-100: #EFE6F8;
      --violet-300: #C8A9E4;
      --violet-500: #8E55BE;
      --violet-600: #7239A2;
      --violet-700: #5B2A86;
      --violet-900: #381A53;
      --gold-100: #F8EDC7;
      --gold-300: #E8C75C;
      --gold-400: #DEB232;
      --gold-500: #D4A017;
      --gold-600: #B28212;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-sans: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-arabic: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
      --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
    }

    @page { size: A4; margin: 16mm 15mm 18mm; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 10pt;
      line-height: 1.5;
    }
    .display { font-family: var(--font-display); font-weight: 600; }

    /* Règles arabes : jamais de serif, jamais d'italique, titres ≥ 600. */
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    html[dir="rtl"] .display,
    html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3 {
      font-family: var(--font-arabic);
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    html[dir="rtl"] .brand,
    html[dir="rtl"] .kicker,
    html[dir="rtl"] .lp-label { letter-spacing: 0; }

    /* ── Masthead (bandeau de titre) ─────────────────────────── */
    .masthead {
      position: relative;
      overflow: hidden;
      background: var(--violet-900);
      color: #F3F0F7;
      border-radius: 4mm;
      padding: 9mm 10mm;
      margin-bottom: 7mm;
    }
    .masthead .glow {
      position: absolute;
      inset-inline-end: -30mm;
      top: -40mm;
      width: 110mm;
      height: 110mm;
      background: radial-gradient(closest-side, rgba(142, 85, 190, 0.55), transparent 70%);
    }
    .brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 3mm;
      font-size: 10pt;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--violet-300);
    }
    .brand::before {
      content: "";
      width: 2.8mm;
      height: 2.8mm;
      transform: rotate(45deg);
      border-radius: 0.6mm;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-600));
    }
    .kicker {
      position: relative;
      margin-top: 5mm;
      color: var(--gold-300);
      font-size: 8.5pt;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .doc-title {
      position: relative;
      margin-top: 2mm;
      font-size: 22pt;
      line-height: 1.12;
      color: #FFFFFF;
    }
    .doc-meta {
      position: relative;
      margin-top: 4mm;
      display: flex;
      flex-wrap: wrap;
      gap: 2mm 6mm;
      font-size: 8.5pt;
      color: var(--violet-300);
    }
    .doc-meta span { white-space: nowrap; }

    /* ── Pitch (bloc mis en avant) ────────────────────────────── */
    .lp-pitch {
      background: var(--violet-50);
      border: 0.3pt solid var(--violet-100);
      border-inline-start: 1.2mm solid var(--violet-500);
      border-radius: 3mm;
      padding: 5mm 6mm;
      margin-bottom: 7mm;
      font-size: 11pt;
      line-height: 1.6;
      color: var(--ink-soft);
    }

    /* ── Sections ────────────────────────────────────────────── */
    .section { margin-bottom: 7mm; break-inside: avoid; }
    .section-title {
      display: flex;
      align-items: center;
      gap: 3mm;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 13pt;
      color: var(--ink);
      margin-bottom: 3.5mm;
    }
    .section-title::before {
      content: "";
      width: 2.6mm;
      height: 2.6mm;
      transform: rotate(45deg);
      border-radius: 0.6mm;
      background: linear-gradient(135deg, var(--violet-500), var(--gold-400));
    }

    /* ── Plan résumé (bullet points) ─────────────────────────── */
    .lp-plan { list-style: none; }
    .lp-plan-item {
      display: flex;
      align-items: flex-start;
      gap: 3mm;
      padding: 2mm 0;
      border-bottom: 0.3pt solid var(--line);
      font-size: 9.5pt;
      color: var(--ink-soft);
    }
    .lp-plan-item:last-child { border-bottom: none; }
    .lp-plan-item::before {
      content: "";
      flex-shrink: 0;
      margin-top: 1.4mm;
      width: 2mm;
      height: 2mm;
      transform: rotate(45deg);
      background: var(--gold-500);
    }

    /* ── Bio instructeur suggérée ─────────────────────────────── */
    .lp-bio {
      background: var(--paper-subtle);
      border: 0.3pt solid var(--line);
      border-radius: 3mm;
      padding: 4.5mm 5mm;
      font-size: 9.5pt;
      color: var(--ink-soft);
    }

    /* ── Arguments différenciants (cartes) ───────────────────── */
    .lp-diff-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3mm;
    }
    .lp-diff-item {
      break-inside: avoid;
      border: 0.3pt solid var(--line);
      border-radius: 3mm;
      padding: 4mm 4.5mm;
      background: var(--paper);
      font-size: 9pt;
      color: var(--ink-soft);
    }
    .lp-diff-item::before {
      content: "";
      display: block;
      width: 2.4mm;
      height: 2.4mm;
      margin-bottom: 2mm;
      transform: rotate(45deg);
      background: linear-gradient(135deg, var(--violet-500), var(--gold-400));
    }

    /* ── Échantillon vidéo ────────────────────────────────────── */
    .lp-sample {
      border: 0.3pt dashed var(--rule);
      border-radius: 3mm;
      padding: 4.5mm 5mm;
      font-size: 9pt;
      color: var(--ink-soft);
    }
    .lp-sample .lp-label { display: block; margin-bottom: 1.5mm; }
    .lp-sample .lp-value { font-family: var(--font-mono); font-size: 8.5pt; word-break: break-all; color: var(--violet-700); }
    .lp-empty {
      border: 0.3pt dashed var(--rule);
      border-radius: 3mm;
      padding: 6mm;
      text-align: center;
      color: var(--muted);
      font-size: 9.5pt;
    }

    .lp-label {
      font-size: 7pt;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Pied de page : instructions de candidature ──────────── */
    .lp-footer {
      margin-top: 8mm;
      padding-top: 4mm;
      border-top: 0.3pt solid var(--line);
      font-size: 8pt;
      color: var(--muted);
      line-height: 1.6;
    }
    .lp-footer strong { color: var(--ink-soft); }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="glow"></div>
    <div class="brand">Salistar</div>
    <div class="kicker">{{docKicker}}</div>
    <h1 class="doc-title display">{{courseTitle}}</h1>
    <div class="doc-meta">
      <span>{{generatedLine}}</span>
      <span>{{levelLine}}</span>
    </div>
  </header>

  <section class="lp-pitch">{{pitch}}</section>

  <section class="section">
    <h2 class="section-title">{{planSectionTitle}}</h2>
    <ul class="lp-plan">
      {{{planHtml}}}
    </ul>
  </section>

  <section class="section">
    <h2 class="section-title">{{bioSectionTitle}}</h2>
    <div class="lp-bio">{{instructorBio}}</div>
  </section>

  <section class="section">
    <h2 class="section-title">{{diffSectionTitle}}</h2>
    <div class="lp-diff-grid">
      {{{differentiatorsHtml}}}
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">{{sampleSectionTitle}}</h2>
    {{{sampleHtml}}}
  </section>

  <footer class="lp-footer">
    <strong>{{applyNoteLabel}}</strong> {{applyNote}}
  </footer>
</body>
</html>

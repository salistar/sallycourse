<!doctype html>
<html lang="{{lang}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <title>SALISTAR — quiz et solutions</title>
  <style>
    /* ============================================================
       SALISTAR — quiz + solutions (A4 portrait, thème clair imprimable)
       Rendu : WeasyPrint (margin boxes @page) ou Playwright PDF.
       Couleurs figées issues de packages/design/src/tokens.json
       (source de vérité : packages/design/src/tokens.ts)

       Fragments générés par le loader (src/pdf-templates.ts) :
         {{{questionsHtml}}} → <article class="qz-question">…
         {{{solutionsHtml}}} → <article class="qz-solution">…
       La section solutions démarre sur une NOUVELLE page, signalée
       par un onglet visuel or (.part-tab-gold).
       ============================================================ */
    :root {
      --paper: #FFFFFF;
      --paper-subtle: #FAF8FC;   /* neutral.50 */
      --ink: #231B2F;            /* neutral.900 */
      --ink-soft: #4B4157;       /* neutral.700 */
      --muted: #7F7492;          /* neutral.500 */
      --line: #E7E2EE;           /* neutral.200 */
      --rule: #D3CBDF;           /* neutral.300 */
      --violet-50: #F8F4FC;
      --violet-100: #EFE6F8;
      --violet-300: #C8A9E4;
      --violet-600: #7239A2;
      --violet-700: #5B2A86;
      --violet-800: #49226C;
      --violet-900: #381A53;
      --gold-50: #FCF7E6;
      --gold-100: #F8EDC7;
      --gold-400: #DEB232;
      --gold-500: #D4A017;
      --gold-600: #B28212;
      --gold-950: #332108;
      --success-600: #1F7F53;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-sans: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-arabic: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    /* En-têtes / pieds de page : margin boxes CSS (WeasyPrint). */
    @page {
      size: A4;
      margin: 24mm 18mm 22mm;
      @top-left {
        content: string(doc-course);
        font-family: "Figtree", "Segoe UI", sans-serif;
        font-size: 7.5pt;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7F7492;
      }
      @top-right {
        content: string(doc-title);
        font-family: "Figtree", "Segoe UI", sans-serif;
        font-size: 7.5pt;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5B2A86;
      }
      @bottom-left {
        content: string(doc-footer);
        font-family: "Figtree", "Segoe UI", sans-serif;
        font-size: 7.5pt;
        color: #7F7492;
      }
      @bottom-center {
        content: counter(page) " / " counter(pages);
        font-family: "Figtree", "Segoe UI", sans-serif;
        font-size: 8pt;
        color: #4B4157;
      }
    }
    /* Première page (masthead) : pas d'en-tête redondant. */
    @page :first {
      @top-left { content: none; }
      @top-right { content: none; }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 10.5pt;
      line-height: 1.55;
    }
    .display { font-family: var(--font-display); font-weight: 600; }

    /* Règles arabes : jamais de serif, jamais d'italique, titres ≥ 600. */
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    html[dir="rtl"] .display,
    html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3 {
      font-family: var(--font-arabic);
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    html[dir="rtl"] .doc-kicker,
    html[dir="rtl"] .part-tab { letter-spacing: 0; }

    /* Coureurs de chaîne pour les margin boxes. */
    .runners { height: 0; overflow: hidden; visibility: hidden; }
    .runner-course { string-set: doc-course content(); }
    .runner-title { string-set: doc-title content(); }
    .runner-footer { string-set: doc-footer content(); }

    /* ------------------------- Masthead ------------------------- */
    .masthead {
      display: flex;
      flex-direction: column;
      gap: 4mm;
      padding-block-end: 7mm;
      margin-block-end: 8mm;
      border-block-end: 0.5pt solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 3mm;
      font-size: 9.5pt;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--violet-600);
    }
    .brand::before {
      content: "";
      width: 2.6mm;
      height: 2.6mm;
      transform: rotate(45deg);
      border-radius: 0.6mm;
      background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
    }
    .doc-kicker {
      color: var(--gold-600);
      font-size: 9pt;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .doc-kicker:empty { display: none; }
    .doc-title { font-size: 24pt; line-height: 1.12; color: var(--violet-900); }
    .doc-course { color: var(--muted); font-size: 10pt; letter-spacing: 0.06em; }
    .doc-intro { color: var(--ink-soft); max-width: 158mm; }
    .doc-intro:empty { display: none; }

    /* --------------- Onglets visuels de partie ------------------ */
    .part-head { break-after: avoid; }
    .part-tab {
      display: inline-flex;
      align-items: center;
      gap: 2.5mm;
      padding: 2.2mm 6.5mm;
      border-radius: 2mm 2mm 0 0;
      font-size: 9.5pt;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .part-tab::before {
      content: "";
      width: 2mm;
      height: 2mm;
      transform: rotate(45deg);
      border-radius: 0.4mm;
    }
    .part-tab-violet { background: var(--violet-700); color: var(--paper); }
    .part-tab-violet::before { background: var(--gold-400); }
    .part-tab-gold {
      background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
      color: var(--gold-950);
    }
    .part-tab-gold::before { background: var(--violet-700); }
    .part-rule { height: 0.8mm; border-radius: 0 1mm 1mm 1mm; margin-block-end: 6mm; }
    .part-rule-violet { background: linear-gradient(to right, var(--violet-700), var(--violet-100)); }
    .part-rule-gold { background: linear-gradient(to right, var(--gold-500), var(--gold-100)); }
    html[dir="rtl"] .part-rule { border-radius: 1mm 0 1mm 1mm; }
    html[dir="rtl"] .part-rule-violet { background: linear-gradient(to left, var(--violet-700), var(--violet-100)); }
    html[dir="rtl"] .part-rule-gold { background: linear-gradient(to left, var(--gold-500), var(--gold-100)); }

    /* La section solutions démarre sur une page dédiée. */
    .qz-solutions { break-before: page; }

    /* ------------------------- Questions ------------------------ */
    .qz-question {
      break-inside: avoid;
      margin-block-end: 4.5mm;
      padding: 4mm 5mm;
      background: var(--paper-subtle);
      border: 0.5pt solid var(--line);
      border-radius: 2mm;
    }
    .qz-q-head {
      display: flex;
      align-items: baseline;
      gap: 3.5mm;
      margin-block-end: 3mm;
    }
    .qz-num {
      flex: none;
      font-family: var(--font-display);
      font-size: 13pt;
      font-weight: 600;
      color: var(--violet-600);
      font-variant-numeric: tabular-nums;
    }
    html[dir="rtl"] .qz-num { font-family: var(--font-arabic); font-weight: 700; }
    .qz-q-head h3 { font-size: 11pt; font-weight: 700; color: var(--ink); }

    .qz-choices {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2mm;
      padding-inline-start: 8.5mm;
    }
    .qz-choice { display: flex; align-items: baseline; gap: 3mm; color: var(--ink-soft); }
    /* Case à cocher élégante, alignée sur la ligne de base. */
    .qz-box {
      flex: none;
      width: 3.4mm;
      height: 3.4mm;
      align-self: center;
      border: 0.5pt solid var(--rule);
      border-radius: 0.8mm;
      background: var(--paper);
    }
    .qz-letter {
      flex: none;
      width: 5mm;
      font-weight: 700;
      font-size: 9pt;
      color: var(--violet-600);
      text-align: center;
    }

    /* ------------------------- Solutions ------------------------ */
    .qz-solution {
      break-inside: avoid;
      margin-block-end: 4mm;
      padding: 3.5mm 5mm;
      background: var(--gold-50);
      border-inline-start: 1.2mm solid var(--gold-500);
      border-radius: 1.5mm;
    }
    .qz-sol-head {
      display: flex;
      align-items: center;
      gap: 3.5mm;
      margin-block-end: 1.5mm;
    }
    .qz-sol-head .qz-num { font-size: 11.5pt; }
    /* Pastille losange or : lettre de la bonne réponse. */
    .qz-answer-badge {
      flex: none;
      width: 6mm;
      height: 6mm;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      border-radius: 1.2mm;
      background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
    }
    .qz-answer-badge > span {
      transform: rotate(-45deg);
      font-size: 8pt;
      font-weight: 700;
      color: var(--gold-950);
    }
    .qz-sol-question { font-weight: 700; font-size: 10pt; color: var(--violet-800); }
    .qz-answer-text { color: var(--success-600); font-weight: 600; font-size: 10pt; }
    .qz-explanation { margin-block-start: 1.5mm; color: var(--ink-soft); font-size: 9.5pt; }
    .qz-explanation:empty { display: none; }
  </style>
</head>
<body>
  <!-- Chaînes des en-têtes/pieds de page (margin boxes). -->
  <div class="runners">
    <span class="runner-course">{{courseTitle}}</span>
    <span class="runner-title">{{docTitle}}</span>
    <span class="runner-footer">{{footerNote}}</span>
  </div>

  <header class="masthead">
    <div class="brand">Salistar</div>
    <div class="doc-kicker">{{docKicker}}</div>
    <h1 class="display doc-title">{{docTitle}}</h1>
    <div class="doc-course">{{courseTitle}}</div>
    <p class="doc-intro">{{intro}}</p>
  </header>

  <!-- Partie 1 : questions (cases à cocher, sans réponses). -->
  <section class="qz-part">
    <div class="part-head"><span class="part-tab part-tab-violet">{{questionsTitle}}</span></div>
    <div class="part-rule part-rule-violet"></div>
    {{{questionsHtml}}}
  </section>

  <!-- Partie 2 : solutions, page dédiée + onglet or. -->
  <section class="qz-part qz-solutions">
    <div class="part-head"><span class="part-tab part-tab-gold">{{solutionsTitle}}</span></div>
    <div class="part-rule part-rule-gold"></div>
    {{{solutionsHtml}}}
  </section>
</body>
</html>

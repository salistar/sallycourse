<!doctype html>
<html lang="{{lang}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <title>SALISTAR — slide schéma</title>
  <style>
    /* ============================================================
       SALISTAR — gabarit "diagram" 1920×1080 (rendu Playwright)
       Zone schéma stylée : panneau encadré sur grille pointillée,
       le contenu ({{diagramHtml}} : SVG ou HTML) est injecté BRUT
       par renderTemplate() et centré dans la zone.
       Couleurs figées issues de packages/design/src/tokens.json
       (source de vérité : packages/design/src/tokens.ts)

       Prompt 83 — deux origines possibles pour {{diagramHtml}}, choisies
       en amont par apps/worker/src/media/slide-renderer.ts :
         1. SVG mermaid.js pré-rendu (si la dépendance est installée) ;
         2. à défaut (mermaid absent des dépendances du worker — cf.
            depsNeeded), un schéma de repli généré par
            renderMermaidFallbackSvg() (@sallycourse/shared/schemas/lesson-content
            + apps/worker/src/media/mermaid-fallback.ts) : les nœuds/arêtes
            du texte Mermoid sont parsés puis disposés en colonnes reliées
            par des flèches SVG simples. Dégradation visuelle assumée
            (pas de mise en page automatique façon dagre) mais zéro
            dépendance réseau et zéro crash si `mermaid` n'est pas dispo.
       Ce gabarit ne sait pas d'où vient le SVG : il se contente de le
       centrer dans `.board`, inchangé depuis avant P83.
       ============================================================ */
    :root {
      --bg: #0D0714;              /* neutral.950 */
      --surface: #171021;         /* themes.dark.surface */
      --surface-subtle: #231B2F;  /* neutral.900 */
      --fg: #F3F0F7;              /* neutral.100 */
      --muted: #A89DBA;           /* neutral.400 */
      --border: #362D43;          /* neutral.800 */
      --violet-300: #C8A9E4;
      --violet-400: #AB7DD3;
      --violet-500: #8E55BE;
      --violet-700: #5B2A86;
      --violet-800: #49226C;
      --violet-900: #381A53;
      --violet-950: #250F3A;
      --gold-300: #E8C75C;
      --gold-400: #DEB232;
      --gold-500: #D4A017;
      --gold-600: #B28212;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-sans: Figtree, "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-arabic: "Slide Arabic", "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    /* Police arabe : @font-face en pur fallback système (zéro réseau) */
    @font-face {
      font-family: "Slide Arabic";
      src: local("IBM Plex Sans Arabic"), local("Noto Sans Arabic"), local("Segoe UI"), local("Tahoma");
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Règles arabes : jamais de serif, jamais d'italique, titres ≥ 600 */
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] .display {
      font-family: var(--font-arabic);
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    html[dir="rtl"] .kicker, html[dir="rtl"] .footer-course { letter-spacing: 0; }

    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 96px 160px 176px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .display { font-family: var(--font-display); font-weight: 600; }

    .kicker {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--gold-400);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .kicker::after {
      content: "";
      height: 1px;
      width: 96px;
      background: linear-gradient(to right, var(--gold-500), transparent);
    }
    html[dir="rtl"] .kicker::after { background: linear-gradient(to left, var(--gold-500), transparent); }

    .title {
      margin-top: 24px;
      font-size: 54px;
      line-height: 1.15;
      letter-spacing: -0.015em;
      max-width: 1500px;
      text-wrap: balance;
    }

    /* ---------- Zone schéma ---------- */
    .board {
      position: relative;
      margin-top: 52px;
      flex: 1;
      min-height: 0;
      border-radius: 20px;
      border: 1px solid var(--border);
      background:
        /* grille de points violets très discrète */
        radial-gradient(circle at center, rgba(142, 85, 190, 0.16) 1.5px, transparent 1.5px) 0 0 / 44px 44px,
        linear-gradient(180deg, var(--surface-subtle), var(--surface) 70%);
      box-shadow:
        inset 0 0 120px rgba(13, 7, 20, 0.55),           /* vignette interne (bg) */
        0 16px 48px -12px rgba(37, 15, 58, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 80px;
      overflow: hidden;
    }
    /* Équerres décoratives or aux quatre coins */
    .corner {
      position: absolute;
      width: 36px;
      height: 36px;
      border: 2px solid var(--gold-500);
      opacity: 0.75;
    }
    .corner-tl { top: 22px;  left: 22px;  border-right: none; border-bottom: none; border-start-start-radius: 8px; }
    .corner-tr { top: 22px;  right: 22px; border-left: none;  border-bottom: none; border-start-end-radius: 8px; }
    .corner-bl { bottom: 22px; left: 22px;  border-right: none; border-top: none; border-end-start-radius: 8px; }
    .corner-br { bottom: 22px; right: 22px; border-left: none;  border-top: none; border-end-end-radius: 8px; }

    /* Le schéma injecté occupe au mieux la zone sans déborder */
    .diagram-content {
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .diagram-content svg,
    .diagram-content img {
      max-width: 1440px;
      max-height: 560px;
      width: auto;
      height: auto;
    }

    /* Légende sous la zone, centrée */
    .caption {
      margin-top: 32px;
      text-align: center;
      font-size: 26px;
      line-height: 1.5;
      color: var(--muted);
      text-wrap: pretty;
    }
    .caption:empty { display: none; }
    /* Petit losange or avant la légende */
    .caption::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-inline-end: 16px;
      transform: rotate(45deg) translateY(-2px);
      border-radius: 2px;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-600));
    }

    /* Pied de page discret : titre du cours + progression */
    .footer {
      position: absolute;
      bottom: 64px;
      inset-inline: 160px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      color: var(--muted);
    }
    .footer-course {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 1100px;
      opacity: 0.85;
    }
    .footer-progress { display: flex; align-items: center; gap: 20px; flex: none; }
    .footer-track {
      width: 320px;
      height: 5px;
      border-radius: 9999px;
      background: var(--border);
      overflow: hidden;
    }
    .footer-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--violet-500), var(--violet-400) 55%, var(--gold-400));
    }
    html[dir="rtl"] .footer-fill { background: linear-gradient(to left, var(--violet-500), var(--violet-400) 55%, var(--gold-400)); }
    .footer-label { font-size: 21px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <header>
      <div class="kicker"><span>{{lessonLabel}} {{lessonNumber}}</span></div>
      <h2 class="display title">{{title}}</h2>
    </header>

    <section class="board" aria-label="schéma">
      <span class="corner corner-tl" aria-hidden="true"></span>
      <span class="corner corner-tr" aria-hidden="true"></span>
      <span class="corner corner-bl" aria-hidden="true"></span>
      <span class="corner corner-br" aria-hidden="true"></span>
      <!-- Schéma injecté brut (SVG/HTML préparé en amont, jamais échappé ici) -->
      <div class="diagram-content">{{diagramHtml}}</div>
    </section>

    <p class="caption">{{caption}}</p>

    <footer class="footer">
      <div class="footer-course">{{courseTitle}}</div>
      <div class="footer-progress">
        <div class="footer-track"><div class="footer-fill" style="width: {{progress}}%"></div></div>
        <span class="footer-label">{{progress}}%</span>
      </div>
    </footer>
  </div>
</body>
</html>

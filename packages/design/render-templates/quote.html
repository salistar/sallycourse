<!doctype html>
<html lang="{{lang}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <title>SALISTAR — slide citation</title>
  <style>
    /* ============================================================
       SALISTAR — gabarit "quote" 1920×1080 (rendu Playwright)
       Citation en exergue : encadré à liseré or, guillemet
       décoratif serif, attribution sobre.
       Couleurs figées issues de packages/design/src/tokens.json
       (source de vérité : packages/design/src/tokens.ts)
       ============================================================ */
    :root {
      --bg: #0D0714;              /* neutral.950 */
      --surface: #171021;         /* themes.dark.surface */
      --surface-subtle: #231B2F;  /* neutral.900 */
      --fg: #F3F0F7;              /* neutral.100 */
      --muted: #A89DBA;           /* neutral.400 */
      --border: #362D43;          /* neutral.800 */
      --violet-300: #C8A9E4;
      --violet-400: #AB7DD3;
      --violet-500: #8E55BE;
      --violet-700: #5B2A86;
      --violet-800: #49226C;
      --violet-900: #381A53;
      --violet-950: #250F3A;
      --gold-200: #F1DC92;
      --gold-300: #E8C75C;
      --gold-400: #DEB232;
      --gold-500: #D4A017;
      --gold-600: #B28212;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-sans: Figtree, "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-arabic: "Slide Arabic", "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    /* Police arabe : @font-face en pur fallback système (zéro réseau) */
    @font-face {
      font-family: "Slide Arabic";
      src: local("IBM Plex Sans Arabic"), local("Noto Sans Arabic"), local("Segoe UI"), local("Tahoma");
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Règles arabes : jamais de serif, jamais d'italique, titres ≥ 600 */
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    html[dir="rtl"] .display, html[dir="rtl"] .quote-text {
      font-family: var(--font-arabic);
      font-style: normal;
      font-weight: 600;
      letter-spacing: 0;
    }
    html[dir="rtl"] .qmark { font-family: var(--font-arabic); font-style: normal; }
    html[dir="rtl"] .footer-course { letter-spacing: 0; }

    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 96px 160px 176px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .display { font-family: var(--font-display); font-weight: 600; }

    /* Halo d'ambiance centré, très discret */
    .glow {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 1400px;
      height: 1000px;
      background: radial-gradient(closest-side, rgba(91, 42, 134, 0.28), transparent 70%);
      pointer-events: none;
    }

    /* ---------- Encadré citation : liseré or côté début de lecture ---------- */
    .quote-card {
      position: relative;
      margin-block: auto;
      max-width: 1480px;
      padding: 88px 112px 84px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--surface-subtle), var(--surface) 60%);
      border: 1px solid var(--border);
      box-shadow: 0 16px 48px -12px rgba(37, 15, 58, 0.6);
    }
    /* Liseré or dégradé, épais, côté inline-start (suit le sens de lecture) */
    .quote-card::before {
      content: "";
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: 8px;
      border-start-start-radius: 20px;
      border-end-start-radius: 20px;
      background: linear-gradient(to bottom, var(--gold-300), var(--gold-500) 45%, var(--gold-600));
    }

    /* Guillemet décoratif géant, serif, or voilé */
    .qmark {
      position: absolute;
      top: -8px;
      inset-inline-start: 56px;
      font-family: var(--font-display);
      font-size: 220px;
      line-height: 1;
      color: var(--gold-500);
      opacity: 0.32;
      user-select: none;
      pointer-events: none;
    }
    .qmark::before { content: "\201C"; }             /* “ */
    html[dir="rtl"] .qmark::before { content: "\00AB"; } /* « — usage arabe */

    .quote-text {
      position: relative;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 62px;
      line-height: 1.32;
      letter-spacing: -0.01em;
      color: var(--fg);
      text-wrap: balance;
    }

    .attribution {
      margin-top: 56px;
      display: flex;
      align-items: center;
      gap: 28px;
    }
    /* Trait or court avant l'attribution */
    .attribution::before {
      content: "";
      flex: none;
      width: 64px;
      height: 2px;
      background: linear-gradient(to right, var(--gold-500), var(--gold-300));
    }
    html[dir="rtl"] .attribution::before { background: linear-gradient(to left, var(--gold-500), var(--gold-300)); }
    .author {
      font-size: 32px;
      font-weight: 600;
      color: var(--violet-300);
      white-space: nowrap;
    }
    .role {
      font-size: 26px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .role:empty { display: none; }

    /* Pied de page discret : titre du cours + progression */
    .footer {
      position: absolute;
      bottom: 64px;
      inset-inline: 160px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      color: var(--muted);
    }
    .footer-course {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 1100px;
      opacity: 0.85;
    }
    .footer-progress { display: flex; align-items: center; gap: 20px; flex: none; }
    .footer-track {
      width: 320px;
      height: 5px;
      border-radius: 9999px;
      background: var(--border);
      overflow: hidden;
    }
    .footer-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--violet-500), var(--violet-400) 55%, var(--gold-400));
    }
    html[dir="rtl"] .footer-fill { background: linear-gradient(to left, var(--violet-500), var(--violet-400) 55%, var(--gold-400)); }
    .footer-label { font-size: 21px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="glow" aria-hidden="true"></div>

    <figure class="quote-card">
      <div class="qmark" aria-hidden="true"></div>
      <blockquote class="quote-text">{{quote}}</blockquote>
      <figcaption class="attribution">
        <span class="author">{{author}}</span>
        <span class="role">{{role}}</span>
      </figcaption>
    </figure>

    <footer class="footer">
      <div class="footer-course">{{courseTitle}}</div>
      <div class="footer-progress">
        <div class="footer-track"><div class="footer-fill" style="width: {{progress}}%"></div></div>
        <span class="footer-label">{{progress}}%</span>
      </div>
    </footer>
  </div>
</body>
</html>

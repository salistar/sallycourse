<!doctype html>
<html lang="{{lang}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <title>SALISTAR — slide comparaison</title>
  <style>
    /* ============================================================
       SALISTAR — gabarit "comparison" 1920×1080 (rendu Playwright)
       Deux colonnes en regard : colonne A liseré violet,
       colonne B liseré or — divider vertical central.
       Couleurs figées issues de packages/design/src/tokens.json
       (source de vérité : packages/design/src/tokens.ts)
       ============================================================ */
    :root {
      /* Gros texte (P137, accessibilité) : 1 par défaut, override injecté par
         renderTemplate({ largeText: true }) — voir render-templates.ts. */
      --text-scale: 1;
      --bg: #0D0714;              /* neutral.950 */
      --surface: #171021;         /* themes.dark.surface */
      --surface-subtle: #231B2F;  /* neutral.900 */
      --fg: #F3F0F7;              /* neutral.100 */
      --muted: #A89DBA;           /* neutral.400 */
      --border: #362D43;          /* neutral.800 */
      --violet-300: #C8A9E4;
      --violet-400: #AB7DD3;
      --violet-500: #8E55BE;
      --violet-700: #5B2A86;
      --violet-800: #49226C;
      --violet-900: #381A53;
      --violet-950: #250F3A;
      --gold-200: #F1DC92;
      --gold-300: #E8C75C;
      --gold-400: #DEB232;
      --gold-500: #D4A017;
      --gold-600: #B28212;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-sans: Figtree, "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-arabic: "Slide Arabic", "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    /* Police arabe : @font-face en pur fallback système (zéro réseau) */
    @font-face {
      font-family: "Slide Arabic";
      src: local("IBM Plex Sans Arabic"), local("Noto Sans Arabic"), local("Segoe UI"), local("Tahoma");
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Règles arabes : jamais de serif, jamais d'italique, titres ≥ 600 */
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3, html[dir="rtl"] .display {
      font-family: var(--font-arabic);
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    html[dir="rtl"] .kicker, html[dir="rtl"] .footer-course { letter-spacing: 0; }

    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 96px 160px 176px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .display { font-family: var(--font-display); font-weight: 600; }

    .kicker {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--gold-400);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .kicker::after {
      content: "";
      height: 1px;
      width: 96px;
      background: linear-gradient(to right, var(--gold-500), transparent);
    }
    html[dir="rtl"] .kicker::after { background: linear-gradient(to left, var(--gold-500), transparent); }

    .title {
      margin-top: 24px;
      font-size: calc(58px * var(--text-scale));
      line-height: 1.15;
      letter-spacing: -0.015em;
      max-width: 1440px;
      text-wrap: balance;
    }

    /* ---------- Deux colonnes ---------- */
    .columns {
      position: relative;
      margin-top: 64px;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 96px;
    }
    /* Divider vertical central, losange or au centre */
    .divider {
      position: absolute;
      left: 50%;
      top: 12px;
      bottom: 12px;
      width: 1px;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, transparent, var(--border) 18%, var(--border) 82%, transparent);
    }
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%) rotate(45deg);
      border-radius: 3px;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-600));
      box-shadow: 0 0 0 10px var(--bg), 0 0 22px rgba(212, 160, 23, 0.4); /* gold.500 */
    }

    .col {
      display: flex;
      flex-direction: column;
      padding: 56px 60px;
      border-radius: 20px;
      background: linear-gradient(180deg, var(--surface-subtle), var(--surface) 65%);
      border: 1px solid var(--border);
      border-block-start-width: 4px;
      min-height: 0;
    }
    .col-a { border-block-start-color: var(--violet-500); }
    .col-b { border-block-start-color: var(--gold-500); }

    .col-title {
      font-size: calc(40px * var(--text-scale));
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    .col-a .col-title { color: var(--violet-300); }
    .col-b .col-title { color: var(--gold-300); }

    .col-items {
      list-style: none;
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 38px;
    }
    .col-items li {
      display: flex;
      align-items: flex-start;
      gap: 26px;
    }
    .col-diamond {
      flex: none;
      width: 14px;
      height: 14px;
      margin-top: 15px;
      transform: rotate(45deg);
      border-radius: 3px;
    }
    .col-a .col-diamond { background: linear-gradient(135deg, var(--violet-300), var(--violet-700)); }
    .col-b .col-diamond { background: linear-gradient(135deg, var(--gold-300), var(--gold-600)); }
    .col-item-text {
      font-size: calc(31px * var(--text-scale));
      line-height: 1.45;
      color: var(--fg);
      text-wrap: pretty;
    }

    /* Pied de page discret : titre du cours + progression */
    .footer {
      position: absolute;
      bottom: 64px;
      inset-inline: 160px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      color: var(--muted);
    }
    .footer-course {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 1100px;
      opacity: 0.85;
    }
    .footer-progress { display: flex; align-items: center; gap: 20px; flex: none; }
    .footer-track {
      width: 320px;
      height: 5px;
      border-radius: 9999px;
      background: var(--border);
      overflow: hidden;
    }
    .footer-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--violet-500), var(--violet-400) 55%, var(--gold-400));
    }
    html[dir="rtl"] .footer-fill { background: linear-gradient(to left, var(--violet-500), var(--violet-400) 55%, var(--gold-400)); }
    .footer-label { font-size: 21px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <header>
      <div class="kicker"><span>{{lessonLabel}} {{lessonNumber}}</span></div>
      <h2 class="display title">{{title}}</h2>
    </header>

    <section class="columns">
      <div class="divider" aria-hidden="true"></div>

      <div class="col col-a">
        <h3 class="display col-title">{{leftTitle}}</h3>
        <!-- Fragments <li> générés et échappés par renderTemplate() — max 4 -->
        <ul class="col-items">
          {{leftItems}}
        </ul>
      </div>

      <div class="col col-b">
        <h3 class="display col-title">{{rightTitle}}</h3>
        <ul class="col-items">
          {{rightItems}}
        </ul>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-course">{{courseTitle}}</div>
      <div class="footer-progress">
        <div class="footer-track"><div class="footer-fill" style="width: {{progress}}%"></div></div>
        <span class="footer-label">{{progress}}%</span>
      </div>
    </footer>
  </div>
</body>
</html>

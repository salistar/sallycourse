<!doctype html>
<html lang="{{lang}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <title>SALISTAR — slide récapitulatif</title>
  <style>
    /* ============================================================
       SALISTAR — gabarit "recap" 1920×1080 (rendu Playwright)
       Checklist de fin de leçon : coches or sur pastilles violettes,
       6 points maximum, deux colonnes au-delà de 4.
       Couleurs figées issues de packages/design/src/tokens.json
       (source de vérité : packages/design/src/tokens.ts)
       ============================================================ */
    :root {
      /* Gros texte (P137, accessibilité) : 1 par défaut, override injecté par
         renderTemplate({ largeText: true }) — voir render-templates.ts. */
      --text-scale: 1;
      --bg: #0D0714;              /* neutral.950 */
      --surface: #171021;         /* themes.dark.surface */
      --surface-subtle: #231B2F;  /* neutral.900 */
      --fg: #F3F0F7;              /* neutral.100 */
      --muted: #A89DBA;           /* neutral.400 */
      --border: #362D43;          /* neutral.800 */
      --violet-300: #C8A9E4;
      --violet-400: #AB7DD3;
      --violet-500: #8E55BE;
      --violet-700: #5B2A86;
      --violet-800: #49226C;
      --violet-900: #381A53;
      --violet-950: #250F3A;
      --gold-200: #F1DC92;
      --gold-300: #E8C75C;
      --gold-400: #DEB232;
      --gold-500: #D4A017;
      --gold-600: #B28212;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-sans: Figtree, "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-arabic: "Slide Arabic", "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    /* Police arabe : @font-face en pur fallback système (zéro réseau) */
    @font-face {
      font-family: "Slide Arabic";
      src: local("IBM Plex Sans Arabic"), local("Noto Sans Arabic"), local("Segoe UI"), local("Tahoma");
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Règles arabes : jamais de serif, jamais d'italique, titres ≥ 600 */
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] .display {
      font-family: var(--font-arabic);
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    html[dir="rtl"] .kicker, html[dir="rtl"] .footer-course { letter-spacing: 0; }

    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 112px 160px 176px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .display { font-family: var(--font-display); font-weight: 600; }

    /* Filigrane losanges en coin, identique au gabarit contenu */
    .corner-motif {
      position: absolute;
      inset-inline-end: -160px;
      bottom: -160px;
      width: 520px;
      height: 520px;
      opacity: 0.5;
      pointer-events: none;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--gold-400);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .kicker::after {
      content: "";
      height: 1px;
      width: 96px;
      background: linear-gradient(to right, var(--gold-500), transparent);
    }
    html[dir="rtl"] .kicker::after { background: linear-gradient(to left, var(--gold-500), transparent); }

    .title {
      margin-top: 28px;
      font-size: calc(64px * var(--text-scale));
      line-height: 1.15;
      letter-spacing: -0.015em;
      max-width: 1440px;
      text-wrap: balance;
    }

    /* ---------- Checklist ---------- */
    .checklist {
      list-style: none;
      margin-top: 80px;
      max-width: 1560px;
      display: flex;
      flex-direction: column;
      gap: 46px;
    }
    /* Au-delà de 4 points, renderTemplate() pose .two-cols : grille 2 colonnes */
    .checklist.two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 88px;
      row-gap: 46px;
      max-width: none;
    }

    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 32px;
    }
    /* Pastille : disque violet profond cerclé, coche or */
    .check {
      flex: none;
      width: 52px;
      height: 52px;
      margin-top: 2px;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 25%, var(--violet-800), var(--violet-950));
      border: 1.5px solid var(--violet-500);
      box-shadow: 0 0 20px rgba(142, 85, 190, 0.3); /* violet.500 */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check svg { width: 26px; height: 26px; display: block; }
    .check-text {
      font-size: calc(35px * var(--text-scale));
      line-height: 1.45;
      color: var(--fg);
      text-wrap: pretty;
      padding-top: 4px;
    }

    /* Pied de page discret : titre du cours + progression */
    .footer {
      position: absolute;
      bottom: 64px;
      inset-inline: 160px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      color: var(--muted);
    }
    .footer-course {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 1100px;
      opacity: 0.85;
    }
    .footer-progress { display: flex; align-items: center; gap: 20px; flex: none; }
    .footer-track {
      width: 320px;
      height: 5px;
      border-radius: 9999px;
      background: var(--border);
      overflow: hidden;
    }
    .footer-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--violet-500), var(--violet-400) 55%, var(--gold-400));
    }
    html[dir="rtl"] .footer-fill { background: linear-gradient(to left, var(--violet-500), var(--violet-400) 55%, var(--gold-400)); }
    .footer-label { font-size: 21px; font-variant-numeric: tabular-nums; }

    /* Image SDXL PAR SLIDE (Lot 3, plan 2026-07-20) — même panneau que le
       gabarit "title"/"content" (render-templates/title.html), pour une
       cohérence visuelle entre tous les gabarits qui la supportent. */
    .illustration {
      position: absolute;
      inset-inline-end: 96px;
      top: 50%;
      transform: translateY(-50%);
      width: 560px;
      height: 560px;
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .illustration img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.92);
    }
    .illustration::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(13, 7, 20, 0.55), transparent 45%),
        radial-gradient(120% 120% at 100% 100%, transparent 60%, rgba(13, 7, 20, 0.5));
    }
    .slide:has(.illustration) .corner-motif { display: none; }
    .slide:has(.illustration) .title,
    .slide:has(.illustration) .checklist { max-width: 1020px; }
  </style>
</head>
<body>
  <div class="slide">
    <svg class="corner-motif" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="translate(260 260)">
        <rect x="-230" y="-230" width="460" height="460" transform="rotate(45)" stroke="var(--violet-900)" stroke-width="1.5" fill="none"/>
        <rect x="-170" y="-170" width="340" height="340" transform="rotate(45)" stroke="var(--violet-800)" stroke-width="1.5" fill="none"/>
        <rect x="-110" y="-110" width="220" height="220" transform="rotate(45)" stroke="var(--violet-700)" stroke-width="1.5" fill="none"/>
      </g>
    </svg>

    <header>
      <div class="kicker"><span>{{lessonLabel}} {{lessonNumber}}</span></div>
      <h2 class="display title">{{title}}</h2>
    </header>

    <!-- Fragments <li> (pastille + texte échappé) générés par renderTemplate() — max 6 -->
    <ul class="checklist{{checklistLayout}}">
      {{items}}
    </ul>

    {{illustrationHtml}}

    <footer class="footer">
      <div class="footer-course">{{courseTitle}}</div>
      <div class="footer-progress">
        <div class="footer-track"><div class="footer-fill" style="width: {{progress}}%"></div></div>
        <span class="footer-label">{{progress}}%</span>
      </div>
    </footer>
  </div>
</body>
</html>

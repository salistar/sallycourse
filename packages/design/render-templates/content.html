<!doctype html>
<html lang="{{lang}}" dir="{{direction}}">
<head>
  <meta charset="utf-8">
  <title>SALISTAR — slide contenu</title>
  <style>
    /* ============================================================
       SALISTAR — gabarit "content" 1920×1080 (rendu Playwright)
       Couleurs figées issues de packages/design/src/tokens.json
       (source de vérité : packages/design/src/tokens.ts)
       ============================================================ */
    :root {
      /* Gros texte (P137, accessibilité) : 1 par défaut, override injecté par
         renderTemplate({ largeText: true }) — voir render-templates.ts. */
      --text-scale: 1;
      --bg: #0D0714;              /* neutral.950 */
      --surface: #171021;         /* themes.dark.surface */
      --surface-subtle: #231B2F;  /* neutral.900 */
      --fg: #F3F0F7;              /* neutral.100 */
      --muted: #A89DBA;           /* neutral.400 */
      --border: #362D43;          /* neutral.800 */
      --violet-300: #C8A9E4;
      --violet-400: #AB7DD3;
      --violet-500: #8E55BE;
      --violet-700: #5B2A86;
      --violet-800: #49226C;
      --violet-900: #381A53;
      --violet-950: #250F3A;
      --gold-200: #F1DC92;
      --gold-300: #E8C75C;
      --gold-400: #DEB232;
      --gold-500: #D4A017;
      --gold-600: #B28212;
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-sans: Figtree, "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-arabic: "Slide Arabic", "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    /* Police arabe : @font-face en pur fallback système (zéro réseau) */
    @font-face {
      font-family: "Slide Arabic";
      src: local("IBM Plex Sans Arabic"), local("Noto Sans Arabic"), local("Segoe UI"), local("Tahoma");
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Règles arabes : jamais de serif, jamais d'italique, titres ≥ 600 */
    html[dir="rtl"] body { font-family: var(--font-arabic); }
    html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] .display {
      font-family: var(--font-arabic);
      font-style: normal;
      font-weight: 700;
      letter-spacing: 0;
    }
    html[dir="rtl"] .kicker, html[dir="rtl"] .footer-course { letter-spacing: 0; }

    .slide {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 112px 160px 176px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .display { font-family: var(--font-display); font-weight: 600; }

    /* Filigrane losange en coin de fin de lecture */
    .corner-motif {
      position: absolute;
      inset-inline-end: -160px;
      bottom: -160px;
      width: 520px;
      height: 520px;
      opacity: 0.5;
      pointer-events: none;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--gold-400);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .kicker::after {
      content: "";
      height: 1px;
      width: 96px;
      background: linear-gradient(to right, var(--gold-500), transparent);
    }
    html[dir="rtl"] .kicker::after { background: linear-gradient(to left, var(--gold-500), transparent); }

    .title {
      margin-top: 28px;
      font-size: calc(64px * var(--text-scale));
      line-height: 1.15;
      letter-spacing: -0.015em;
      max-width: 1440px;
      text-wrap: balance;
    }

    /* Liste à puces : losanges or, 5 points maximum, interlignage aéré */
    .bullets {
      list-style: none;
      margin-top: 84px;
      max-width: 1480px;
      display: flex;
      flex-direction: column;
      gap: 52px;
    }
    .bullets li {
      display: flex;
      align-items: flex-start;
      gap: 36px;
    }
    .bullet-diamond {
      flex: none;
      width: 18px;
      height: 18px;
      margin-top: 17px;
      transform: rotate(45deg);
      border-radius: 3px;
      background: linear-gradient(135deg, var(--gold-300), var(--gold-600));
      box-shadow: 0 0 18px rgba(212, 160, 23, 0.35); /* gold.500 */
    }
    .bullet-text {
      font-size: calc(37px * var(--text-scale));
      line-height: 1.45;
      color: var(--fg);
      text-wrap: pretty;
    }

    /* Pied de page discret : titre du cours + progression */
    .footer {
      position: absolute;
      bottom: 64px;
      inset-inline: 160px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 48px;
      color: var(--muted);
    }
    .footer-course {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 1100px;
      opacity: 0.85;
    }
    .footer-progress { display: flex; align-items: center; gap: 20px; flex: none; }
    .footer-track {
      width: 320px;
      height: 5px;
      border-radius: 9999px;
      background: var(--border);
      overflow: hidden;
    }
    .footer-fill {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(to right, var(--violet-500), var(--violet-400) 55%, var(--gold-400));
    }
    html[dir="rtl"] .footer-fill { background: linear-gradient(to left, var(--violet-500), var(--violet-400) 55%, var(--gold-400)); }
    .footer-label { font-size: 21px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <svg class="corner-motif" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="translate(260 260)">
        <rect x="-230" y="-230" width="460" height="460" transform="rotate(45)" stroke="var(--violet-900)" stroke-width="1.5" fill="none"/>
        <rect x="-170" y="-170" width="340" height="340" transform="rotate(45)" stroke="var(--violet-800)" stroke-width="1.5" fill="none"/>
        <rect x="-110" y="-110" width="220" height="220" transform="rotate(45)" stroke="var(--violet-700)" stroke-width="1.5" fill="none"/>
      </g>
    </svg>

    <header>
      <div class="kicker"><span>{{lessonLabel}} {{lessonNumber}}</span></div>
      <h2 class="display title">{{title}}</h2>
    </header>

    <!-- Fragments <li> générés et échappés par renderTemplate() — max 5 -->
    <ul class="bullets">
      {{bullets}}
    </ul>

    <footer class="footer">
      <div class="footer-course">{{courseTitle}}</div>
      <div class="footer-progress">
        <div class="footer-track"><div class="footer-fill" style="width: {{progress}}%"></div></div>
        <span class="footer-label">{{progress}}%</span>
      </div>
    </footer>
  </div>
</body>
</html>
